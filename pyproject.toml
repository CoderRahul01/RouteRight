[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "routeright"
version = "0.1.0"
description = "Model router for Strands agents - routes requests to frontier or small models using Strands Decider 2B"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "RouteRight Contributors"}
]
keywords = ["strands", "decider", "model-routing", "bedrock", "llm"]

dependencies = [
    "strands-agents>=0.1.0",
    "strands-decider>=0.1.0",
    "boto3>=1.28.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["routeright*"]
